 background-color: rgb(125, 30, 250);

      display: flex;               /* Asegura columnas lado a lado */

      padding: 20px;
      gap: 20px;
      width: 100%;
      box-sizing: border-box;
    }

    .columna {
      flex: 1;
      background: #561e96;
      border: 1px solid #ddd;
      padding: 20px;
      box-sizing: border-box;
      min-width: 0;               /* Evita que las columnas salten de línea */
    }

    /* --- PIE DE PÁGINA --- */

      background-color: #018d57;

      text-align: center;

      margin-top: 20px;
    }

      .contenedor {

      }
    }

#imagenes {
