<!DOCTYPE html> <!-- Archivo HTML -->
<html lang="es"> <!-- Establecido español para que lo entienda mejor la página -->

<head>  <!-- Metadatos -->
  <meta charset="UTF-8">   <!-- Lenguaje que incluye tildes y ñ -->
  <title>Mi primera página</title>    <!-- Nombre visible en la pestaña -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <!-- Adaptación plataforma -->




  <style>  /* --- Abro CSS --- */

body {  /* --- General página --- */
  background-color: #2f2f49;   /* --- Color de fondo de la página --- */
  font-family: 'Franklin Gothic Medium';  /* --- Defino fuente de letra --- */
}

    /* --- MENÚ SUPERIOR --- */
    nav {                                 /* --- El nav entero seleccionado --- */
      background-color:transparent;        /* --- Lo pongo transparente para luego editarlo mejor --- */
    }


h1 {                           /* --- Encabezado página --- */
text-align:center             /* --- Alineado céntrico --- */
}

.Blanco{   /* --- Clase comentada abajo --- */
color: white;  /* --- Color blanco de letras --- */
}

.Centrico{                    /* --- Selección de clase para poner numerosos párrafos centricos o otras ediciones --- */
text-align:center;
color: white;
}


    nav ul {                  /* --- Dentro del nav, la lista desordenada --- */
      list-style: none;  /* --- No contenta estilo propio --- */
      margin: 0;        /* --- Sin margen ni padding --- */
      padding: 0;
      display: flex;   /* --- Disposición del menú --- */
    }



.hobbies {    /* --- Defino tamaño de las imágenes --- */
  width: 400px;  /* --- Ancho --- */
  height: 350px;  /* --- Altura --- */
}


.Poster {
  width: 300px;
  height: 400px;
}


#Menucaja {
  background-color: rgb(20, 14, 92);   /* --- Color de fondo del div --- */
  max-width: 60%;            /* ancho del menú */
  margin: 0 auto;              /* lo centra */
  padding: 5px 10px;           /* tamaño más pequeño */
  margin-top: 1%;           /* --- Márgen superior --- */
  margin-bottom: 1%;         /* --- Márgen inferior --- */
}


#Titulocaja {
 background-color: rgb(125, 30, 250);
  max-width: 80%;            /* ancho del menú */
  margin: 0 auto;              /* lo centra */
  padding: 5px 10px;           /* tamaño más pequeño */
  margin-top: 2%;
}


#Banner {
  width: 60%;    
  height: 200px;
  display: block;   /* --- Lo pongo a modo de elemento de bloque para centrarlo --- */
  margin: 0 auto;
}

.Logos {
width: 40px;
height: 40px;

}

.Minititulo {
  background-color: rgb(12, 6, 66);
  max-width: 30%;            /* --- Ancho máximo --- */
  margin: 0 auto;              
  padding: 1px 3px;           
  margin-top: 1%;
  margin-bottom: 2%;
  border: 1px solid #000000;  /* --- Defino borde, tamaño y color --- */
  text-align: center;
}

    nav li a {
      display: block;
      padding: 14px 20px;
      color: white;
      text-decoration: none;  /* --- Sin decorado --- */
    }

    nav li a:hover {
      background-color: #cc74ff;   /* --- Defino el color de los botones al pasar por encima el ratón --- */
    }

    /* --- DOS COLUMNAS (CORREGIDO) --- */
    .contenedor {
      display: flex;               /* Aseguro columnas lado a lado */
      flex-direction: row;         /* Fuerzo fila horizontal */
      padding: 20px;
      gap: 20px;
      width: 100%;
      box-sizing: border-box;
    }

    .columna {
      flex: 1;
      background: #561e96;
      border: 1px solid #ddd;
      padding: 20px;
      box-sizing: border-box;
      min-width: 0;               /* Evito que las columnas salten de línea */
    }

    /* --- PIE DE PÁGINA --- */
    footer {    /* --- Defino el footer, pie de página --- */
      background-color: #018d57;
      color: white;
      text-align: center;
      padding: 15px 0;
      margin-top: 20px;
    }

    /* --- RESPONSIVE: SOLO en pantallas pequeñas --- */
    @media (max-width: 700px) {
      .contenedor {
        flex-direction: column;    /* SOLO en móvil se apilan */
      }
    }

#imagenes {
    display: grid;  /* --- Está a modo de grid o parrilla --- */
  grid-template-columns: repeat(2, auto); /* 2 columnas, ancho automático  */
  gap: 50px;
  justify-content: center;   /* centra las columnas dentro del contenedor */
  margin: 20px auto;         /* centra el contenedor en la página */
  max-width: 500px;          /* ajusta el ancho total de la cuadrícula */
  margin-top: 300px;
}


#pelis {
    display: grid;
  grid-template-columns: repeat(2, auto); /* 2 columnas, ancho automático  */
  gap: 30px;
  justify-content: center;   /* centra las columnas dentro del contenedor */
  margin: 20px auto;         /* centra el contenedor en la página */
  max-width: 500px;          /* ajusta el ancho total de la cuadrícula */
}


/* Estilo del botón */
.boton-ancla {
padding: 10px 20px;  /* Espacio entre bloque y contenido del elemento */
background-color: rgb(0, 255, 128);
color: white;
border: none;  /* Sin borde definido */
border-radius: 5px;  /* Radio del borde */
cursor: pointer;  /* Cursor al pasar por encima */
font-size: 16px;
text-decoration: none;  /* Le quito el subrayado por estética */
	}


  /* Contenedor que centra su contenido */
.centro {    /* Selecciono clase */
text-align: center; /* centra horizontalmente */
margin-top: 20px;   /* espacio arriba */
}


  </style>
  
</head>

</div> <!-- Cierro las columnas -->

</html>
